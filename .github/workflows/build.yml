name: Build Sit and Watch Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -type f | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP found in repository root!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/source"
          unzip -o "$ZIP" -d "$RUNNER_TEMP/source"

          PROJECT=$(find "$RUNNER_TEMP/source" -name build.gradle -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "build.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Sit-and-watch-Mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
