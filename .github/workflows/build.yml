```yaml
name: Build Sit and Watch Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract source ZIP automatically
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/source"
          unzip -o "$ZIP_FILE" -d "$RUNNER_TEMP/source"

          BUILD_FILE=$(find "$RUNNER_TEMP/source" \
            -type f -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "Could not find build.gradle!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully!"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Validate project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d src/main/java
          test -d src/main/resources
          test -f build.gradle
          test -f gradle.properties
          echo "Project validation successful!"

      - name: Build Minecraft Mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle build --no-daemon --stacktrace

      - name: Prepare final JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/release"

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name "*.jar" \
            ! -iname "*sources*" \
            ! -iname "*-dev.jar" | sort | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No compiled JAR found!"
            exit 1
          fi

          cp "$JAR" "$PROJECT_DIR/release/Sit-and-watch.jar"

          echo "Final mod successfully prepared!"
          ls -lh "$PROJECT_DIR/release/"

      - name: Upload finished Minecraft Mod
        uses: actions/upload-artifact@v4
        with:
          name: Sit-and-watch.jar
          path: ${{ env.PROJECT_DIR }}/release/Sit-and-watch.jar
          if-no-files-found: error
          retention-days: 30
```
